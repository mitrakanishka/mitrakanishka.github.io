  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

f value=\"{{ h.year }}\" hint-placeholder-val=\"{{ true }}\">\n<span style=\"font:600 12px 'Source Sans 3',sans-serif;color:#8a6a1f;font-variant-numeric:tabular-nums;letter-spacing:.03em;white-space:nowrap\">{{ h.year }}<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"margin-top:24px\">\n<div style=\"display:flex;align-items:baseline;gap:11px;border-bottom:1px solid #2b3b54;padding-bottom:5px;margin-bottom:12px\">\n<span style=\"font:600 11px 'Source Sans 3',sans-serif;letter-spacing:.12em;color:#a9842f;min-width:22px\">IX<\u002Fspan>\n<h2 style=\"margin:0;font:600 13.5px 'Spectral',Georgia,serif;letter-spacing:.16em;text-transform:uppercase;color:#21426b\">Skills<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<sc-for list=\"{{ skills }}\" as=\"s\" hint-placeholder-count=\"2\">\n<div style=\"display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:baseline\">\n<span style=\"font:600 11px 'Source Sans 3',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#a9842f\">{{ s.label }}<\u002Fspan>\n<span style=\"font:400 13px/1.55 'Source Sans 3',sans-serif;color:#34302a\">{{ s.items }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"margin-top:24px\">\n<div style=\"display:flex;align-items:baseline;gap:11px;border-bottom:1px solid #2b3b54;padding-bottom:5px;margin-bottom:12px\">\n<span style=\"font:600 11px 'Source Sans 3',sans-serif;letter-spacing:.12em;color:#a9842f;min-width:22px\">X<\u002Fspan>\n<h2 style=\"margin:0;font:600 13.5px 'Spectral',Georgia,serif;letter-spacing:.16em;text-transform:uppercase;color:#21426b\">References<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px 26px\">\n<sc-for list=\"{{ references }}\" as=\"r\" hint-placeholder-count=\"5\">\n<div class=\"nobreak\" style=\"border-left:2px solid #c9a24b;padding-left:13px\">\n<div style=\"font:600 13.5px 'Spectral',Georgia,serif;color:#21426b\"><a href=\"{{ r.profileUrl }}\" target=\"_blank\" rel=\"noopener\">{{ r.name }}<\u002Fa><\u002Fdiv>\n<div style=\"font:500 12px 'Source Sans 3',sans-serif;color:#4a463e;margin-top:2px\">{{ r.role }}<\u002Fdiv>\n<div style=\"font:400 12px/1.45 'Source Sans 3',sans-serif;color:#6e6557;margin-top:1px\">{{ r.org }}<\u002Fdiv>\n<div style=\"font:400 12px 'Source Sans 3',sans-serif;color:#6e6557;margin-top:4px\">{{ r.phone }} · <a href=\"mailto:{{ r.email }}\">{{ r.email }}<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Ftd><\u002Ftr><\u002Ftbody>\n<tfoot><tr><td class=\"ftr-space\"><\u002Ftd><\u002Ftr><\u002Ftfoot>\n<\u002Ftable>\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      edu: [\n        { school: 'Massachusetts Institute of Technology', dates: '2024 – 2028', degree: 'Electrical Engineering and Computer Science, Ph.D.', score: '5.00 / 5.00', advisor: 'Advisor: Dr. Mehrdad Jazayeri', thesis: '' },\n        { school: 'The University of Texas at Austin', dates: '2017 – 2023', degree: 'Electrical and Computer Engineering, BSEE / MSE', score: '3.95 / 4.00 GPA', advisor: 'Advisors: Dr. José del R. Millán and Dr. Ashish Deshpande', thesis: '“Characterizing the onset and offset of motor imagery during passive arm movements to control an upper-body exoskeleton”' }\n      ],\n      research: [\n        { title: 'Clinical Neuroprosthetics and Brain Interaction Lab (CNBI) / Rehabilitation Neuromuscular (ReNeu) Robotics Lab', dates: 'Jan 2022 – Aug 2024', sub: 'Supervisors: José del R. Millán, Ph.D. and Ashish Deshpande, Ph.D.', bullets: [\n          'Developed a non-invasive brain-machine interface to detect onset and termination of motor imagery and control upper-body rehabilitation exoskeleton for improving motor dysfunctions post-stroke.',\n          'Designed experimental protocol to capture electroencephalogram (EEG) signals of onset and termination motor imagery during passive arm movements evoked by exoskeleton from 12 healthy participants.',\n          'Processed and analyzed EEG signals in real-time using MATLAB to create decoders to detect and trigger the start and end of exoskeleton reaching task.',\n          'Created novel real-time, non-linear machine learning algorithms (Riemannian geometry-based classifiers) to decode highly variant and non-stationary EEG signals. Achieved average onset decoder performance of 64.0% and termination decoder of 66.6%.'\n        ] },\n        { title: 'Graduate Research Assistant, Khurshid Lab, Dell Medical School', dates: 'Jan 2022 – May 2023', sub: 'Supervisor: Anjum Khurshid, M.D., Ph.D.', bullets: [\n          'Applied data analysis and machine learning techniques to collect, analyze, and identify patterns in social service and health data that uncovered critical insights, revealing gaps in community-based health care.'\n        ] },\n        { title: 'President’s Award for Global Learning, Texas Global', dates: 'Jan 2019 – May 2021', sub: 'Supervisors: Jaqueline Angel, Ph.D., Meeta Kothare, Ph.D., Meghana Gadgil, M.D., MPH', bullets: [\n          'Awarded $113,000 grant to implement and execute 10-week project in Puebla, Mexico to study and address diabetic complications through design thinking and technological solutions.',\n          'Published a peer-reviewed paper called “Mind the Gap: A Scoping Review of Aging and Diabetes in Mexico” in journal: Aging in the Americas.',\n          'Recruited and interviewed 14 patients in the Austin area to discover gaps in diabetes management and care to identify potential points of intervention.',\n          'Presented our findings to Lone Star Circle of Care Clinic in Rundberg, Austin, which helped fund new kitchen in the clinic to aid in better diet management and education for patients.'\n        ] },\n        { title: 'Undergraduate Research Assistant, ReNeu Robotics Laboratory', dates: 'Jun 2018 – Mar 2020', sub: 'Supervisor: Ashish Deshpande, Ph.D.', bullets: [\n          'Constructed virtual simulation in VREP of stroke therapy exoskeleton robot using C++ to perform various external experiments on the individual joints.',\n          'Conducted research experiments to analyze muscular efforts in exoskeleton by developing LabView code that measured and collected data from EMGs which were processed through MATLAB.'\n        ] },\n        { title: 'Research Apprentice, Applied Research Laboratories (ARL)', dates: 'Jun 2017 – Aug 2017', sub: 'Supervisor: Brian La Cour, Ph.D.', bullets: [\n          'Developed QASM (Quantum Assembly Language) software interface for a quantum emulation device which allowed for more robust experimentation and aided in the education curriculum of the Quantum Computing FRI (Freshman Research Initiative) Stream.',\n          'Published research paper in the “ARL Science and Engineering Apprenticeship Program” for ARL and presented research to ARL staff and UT faculty which was awarded honorable mention for the Best Presentation.'\n        ] }\n      ],\n      industry: [\n        { title: 'Robotics Engineer II, Contoro Robotics', dates: 'Sep 2023 – Aug 2024', bullets: [\n          'Utilizing deep learning techniques to enhance object detection and perception capabilities of industrial robot arm, resulting in improved efficiency and precision in complex warehouse unloading tasks.',\n          'Orchestrated and led successful pilot program in customer warehouse and improved overall unloading rate of automated robot from 100 boxes per hour to 250 boxes per hour.'\n        ] },\n        { title: 'Applications Engineering Intern, Cirrus Logic', dates: 'Sep 2021 – Dec 2021', bullets: [\n          'Created Python GUI that effectively configures different haptic waveforms and behaviors for haptic hardware devices that will be used by Cirrus Logic’s Field Engineers and customers.',\n          'Designed and implemented custom PCB on active stylus to enable haptic effects based on measured values from force sensor, which was pitched to relevant Cirrus Logic customers.'\n        ] },\n        { title: 'Applications Engineering Intern, Texas Instruments', dates: 'May 2021 – Aug 2021', bullets: [\n          'Evaluated competitor LDO models using PSPICE to compare and assess accuracy vs. input voltage and current, transient performance, PSRR, Noise, and thermal shutdown.',\n          'Presented findings to our team of Application Engineers and Marketing Managers to identify competitive gaps and suggest possible innovations to current TI LDO models.'\n        ] },\n        { title: 'Analog Field Application Engineering Intern, Texas Instruments', dates: 'May 2019 – Aug 2019', bullets: [\n          'Designed and proposed power architecture for automotive HUD (heads-up display) from ideation to layout that was implemented in 2022 GM vehicles.',\n          'Devised surround-view system schematic for level two autonomous driving.',\n          'Supported various consumers in the automotive industry by meeting design requirements, drawing schematics, and debugging hardware issues.',\n          'Led presentation on transistors with engineers in the office and product line managers that were invited to discuss current transistor technologies and their future applications.'\n        ] },\n        { title: 'Cofounder, sPark – Smart Parking, LLC', dates: 'Jun 2017 – May 2018', bullets: [\n          'Launched iOS application for peer-to-peer marketplace for parking, that connects people who need to park with available parking spaces, by using Swift to build the UI and CocoaPods as the backend.',\n          'Pitched at Capital Factory Accelerator program, the largest startup accelerator in Austin, Texas.',\n          'Collaborated with partner to develop and finance this application.'\n        ] }\n      ],\n      teaching: [\n        { title: 'Teaching Assistant for Engineering Communications, UT Austin', dates: 'Spring & Fall 2022, Spring 2023', sub: 'PGE 33T · Prof. Deborah Hempel-Medina · Overall rating: 4.8 / 5', bullets: [\n          'Helping students build their career and communication skills through office hours and tutoring.',\n          'Delivering lectures on the interviewing process, negotiating skills, and technical writing to a class size of 30 to 50 students.'\n        ] },\n        { title: 'Teaching Assistant for Digital Logic Design, UT Austin', dates: 'Spring 2021', sub: 'EE 316 · Dr. David Pan and Dr. Michael Orshansky · Overall rating: 5 / 5', bullets: [\n          'Meet with students weekly to assist them through homework, projects, and exam preparation.',\n          'Taught students how to code in Verilog and program Xilinx FPGA development boards.'\n        ] }\n      ],\n      honors: [\n        { text: 'Patrick J. McGovern Travel & Technology Award, McGovern Institute for Brain Research', year: '2026' },\n        { linkText: 'Siebel Scholar', url: 'https://www.siebelscholars.com/articles/siebel-scholars-foundation-announces-class-of-2026/', text: ' — awarded annually for academic excellence and leadership to ~80 top graduate students across leading universities', year: '2026' },\n        { linkText: 'SERC Scholar', url: 'https://computing.mit.edu/cross-cutting/social-and-ethical-responsibilities-of-computing/serc-scholars-program/', text: ', MIT Schwarzman College of Computing', year: '2025' },\n        { text: 'NSF Graduate Research Fellowship Program (GRFP), Honorable Mention', year: '2025' },\n        { text: 'Alan V. Oppenheim Fellowship of Exemplary Achievement, MIT EECS', year: '2024' },\n        { linkText: 'Attendee’s Choice Award', url: 'https://sites.utexas.edu/jdrmillan/2023/09/01/kanishka-mitra-wins-the-attendees-choice-award-at-interface-rice-2023-poster-session/', text: ', Best Poster, InterfaceRice Conference (out of 65 posters)', year: '2023' },\n        { text: 'ECE Capstone Design Showcase, Honorable Mention, Best Research Project', year: '2021' },\n        { text: 'Aggarwal–McGonigle Summer Research Fellowship', year: '2020' },\n        { linkText: 'President’s Award for Global Learning', url: 'https://news.utexas.edu/2019/10/30/winning-teams-selected-for-the-2019-20-presidents-award-for-global-learning/', text: ', Texas Global', year: '2019' },\n        { text: 'Pacbot National Robotics Competition, Third Place, IEEE Robotics & Automation Society (RAS)', year: '2018' },\n        { text: 'ARL Science & Engineering Apprenticeship Program, Honorable Mention, Best Presentation', year: '2017' },\n        { text: 'Dr. Francis X. Bostick, Jr. Endowed Scholarship, UT Austin ECE', year: '' }\n      ],\n      skills: [\n        { label: 'Software', items: 'Python · PyTorch / TensorFlow · MATLAB · C/C++ · BASH · Signal Processing · Machine Learning' },\n        { label: 'Hardware', items: 'Verilog · RTL Design · PCB Design · Cadence (Schematic and Layout Design) · PSPICE · Fusion 360 · FPGA configuration · Embedded Systems' }\n      ],\n      references: [\n        { name: 'Mehrdad Jazayeri, Ph.D.', profileUrl: 'https://mcgovern.mit.edu/profile/mehrdad-jazayeri/', role: 'Professor', org: 'Brain and Cognitive Sciences, Massachusetts Institute of Technology', phone: '(617) 715–5418', email: 'mjaz@mit.edu' },\n        { name: 'José del R. Millán, Ph.D.', profileUrl: 'https://www.ece.utexas.edu/people/faculty/jose-del-r-millan', role: 'Professor', org: 'Department of Electrical and Computer Engineering, The University of Texas at Austin', phone: '(512) 232–8111', email: 'jose.millan@austin.utexas.edu' },\n        { name: 'Ashish Deshpande, Ph.D.', profileUrl: 'https://www.me.utexas.edu/people/faculty-directory/deshpande', role: 'Professor', org: 'Department of Mechanical Engineering, The University of Texas at Austin', phone: '(512) 475–7773', email: 'ashish@austin.utexas.edu' },\n        { name: 'Deborah Hempel-Medina', profileUrl: 'https://pge.utexas.edu/facultystaff/faculty-directory/hempel-medina', role: 'Senior Lecturer', org: 'Department of Petroleum and Geosystems Engineering, The University of Texas at Austin', phone: '(512) 471–3214', email: 'dhempelmedina@austin.utexas.edu' },\n        { name: 'Meghana Gadgil, M.D., MPH', profileUrl: 'https://publichealth.berkeley.edu/people/meghana-gadgil/', role: 'Assistant Professor', org: 'Department of Medicine / Public Health, University of California, San Francisco / Berkeley', phone: '(510) 387–8427', email: 'meghana.gadgil2@ucsf.edu' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
